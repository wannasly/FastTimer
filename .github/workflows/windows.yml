name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.97.1
      - name: Check formatting, lint and test
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked
      - name: Build Windows distribution
        run: .\scripts\Build-Release.ps1
      - name: Smoke-test installation, CLI and removal
        run: |
          $setup = Get-ChildItem -LiteralPath target/distribution -Filter '*-setup.exe' | Select-Object -First 1
          .\scripts\Test-Installer.ps1 -Installer $setup.FullName
      - name: Upload Windows distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FastTimer-windows-x64
          path: target/distribution/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: FastTimer-windows-x64
          path: distribution
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          prefix="FastTimer-$version-windows-x64"
          cd distribution
          sha256sum --check SHA256SUMS.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "FastTimer $version" --generate-notes \
            --notes "Windows 11 x64. Choose the setup wizard, the portable bundle, or the standalone CLI. SHA-256 hashes are included." \
            "$prefix-setup.exe#Windows x64 installer" \
            "$prefix-portable.zip#Windows x64 portable bundle" \
            'fasttimer-cli.exe#Standalone CLI' \
            'SHA256SUMS.txt#SHA-256 checksums'
