[package]
name = "fasttimer"
version = "1.0.0"
edition = "2024"
description = "Windows timer resolution and Sleep(1) diagnostics"
default-run = "fasttimer"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media",
    "Win32_Security", "Win32_System_Console", "Win32_System_LibraryLoader",
    "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = "thin"
strip = "debuginfo"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
